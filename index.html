<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Mini App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Шапка с балансом и меню -->
        <header>
            <div class="menu-button" id="menuButton">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            <div class="balance" id="balance">
                Баланс: <span id="balanceAmount">0</span> 💰
            </div>
        </header>

        <!-- Основной контент -->
        <main>
            <h1>Добро пожаловать в Mini App!</h1>
            <button onclick="addBalance(100)">+100 монет</button>
            <button onclick="updateBalanceInBot()">Обновить баланс</button>
        </main>

        <!-- Боковое меню -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Меню</h2>
                <button class="close-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <nav class="sidebar-menu">
                <a href="#" onclick="showPage('profile')">👤 Профиль</a>
                <a href="#" onclick="showPage('settings')">⚙️ Настройки</a>
                <a href="#" onclick="showPage('about')">ℹ️ О нас</a>
                <a href="#" onclick="showPage('contact')">📞 Контакты</a>
            </nav>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
